<!DOCTYPE html>
<html lang="ru">
<head>

<title>404 — Страница не найдена | DIGITALVERSE</title>
<style>
  :root{color-scheme:dark}
  *{margin:0;box-sizing:border-box}
  body{min-height:100svh;display:grid;place-items:center;gap:0;
    background:#08080A;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    text-align:center;padding:24px}
  .n{font-size:clamp(64px,18vw,140px);font-weight:800;letter-spacing:-.04em;
    color:#EC3237;line-height:1}
  h1{font-size:clamp(18px,4vw,24px);margin:8px 0 10px;text-transform:uppercase;letter-spacing:.02em}
  p{color:#9A9AA3;max-width:36ch;margin:0 auto 26px}
  a{display:inline-block;padding:13px 26px;border-radius:999px;background:#EC3237;
    color:#fff;text-decoration:none;font-weight:700}
  a:hover{background:#EE5155}
</style>
</head>
<body>
  <div>
    <div class="n">404</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы нет или она была перемещена.</p>
    <a href="/">На главную</a>
  </div>
